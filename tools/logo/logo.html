<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Baloo; src: url("../../assets/fonts/Baloo2.ttf"); font-weight: 400 800; }
html, body { margin: 0; background: transparent; }
svg { display: block; }
</style></head>
<body>
<svg width="1000" height="780" viewBox="0 0 1000 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="50%">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffd27a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0705a"/><stop offset="1" stop-color="#b8332c"/>
    </linearGradient>
    <linearGradient id="roofTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8f6e"/><stop offset="1" stop-color="#d2483a"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4dc"/><stop offset="1" stop-color="#f0d4a2"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b9743f"/><stop offset="1" stop-color="#8a5028"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#ffb84d"/>
    </linearGradient>
    <radialGradient id="lantern" cx="45%" cy="40%" r="60%">
      <stop offset="0" stop-color="#fff2a0"/><stop offset="0.4" stop-color="#ffb347"/><stop offset="1" stop-color="#d6313f"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffbe0"/><stop offset="0.45" stop-color="#ffd84a"/><stop offset="1" stop-color="#f28a1e"/>
    </linearGradient>
    <linearGradient id="idle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8ee06a"/><stop offset="1" stop-color="#3f9a2e"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e2ea"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#4a1f0a" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- quầng sáng + tia -->
  <circle cx="500" cy="330" r="390" fill="url(#glow)"/>
  <g opacity="0.16" fill="#ffe9a8"><path d="M500 330 L1060 330 L1049 439 Z"/><path d="M500 330 L1017 544 L966 641 Z"/><path d="M500 330 L896 726 L811 796 Z"/><path d="M500 330 L714 847 L609 879 Z"/><path d="M500 330 L500 890 L391 879 Z"/><path d="M500 330 L286 847 L189 796 Z"/><path d="M500 330 L104 726 L34 641 Z"/><path d="M500 330 L-17 544 L-49 439 Z"/><path d="M500 330 L-60 330 L-49 221 Z"/><path d="M500 330 L-17 116 L34 19 Z"/><path d="M500 330 L104 -66 L189 -136 Z"/><path d="M500 330 L286 -187 L391 -219 Z"/><path d="M500 330 L500 -230 L609 -219 Z"/><path d="M500 330 L714 -187 L811 -136 Z"/><path d="M500 330 L896 -66 L966 19 Z"/><path d="M500 330 L1017 116 L1049 221 Z"/></g>

  <g filter="url(#shadow)">
    <!-- nhà -->
    <rect x="300" y="215" width="400" height="215" rx="14" fill="url(#wall)" stroke="#5a341f" stroke-width="10"/>
    <rect x="300" y="380" width="400" height="50" rx="10" fill="url(#wood)" stroke="#5a341f" stroke-width="8"/>
    <!-- cửa sổ sáng đèn -->
    <rect x="330" y="255" width="90" height="90" rx="12" fill="url(#win)" stroke="#5a341f" stroke-width="8"/>
    <path d="M375 255 V345 M330 300 H420" stroke="#8a5028" stroke-width="8"/>
    <rect x="580" y="255" width="90" height="90" rx="12" fill="url(#win)" stroke="#5a341f" stroke-width="8"/>
    <path d="M625 255 V345 M580 300 H670" stroke="#8a5028" stroke-width="8"/>
    <!-- cửa -->
    <path d="M450 430 V300 Q500 255 550 300 V430 Z" fill="url(#wood)" stroke="#5a341f" stroke-width="9"/>
    <circle cx="532" cy="370" r="8" fill="#ffd34d" stroke="#5a341f" stroke-width="4"/>
    <!-- mái cong 2 tầng -->
    <path d="M250 222 Q300 200 330 150 L670 150 Q700 200 750 222 Q760 236 740 236 L260 236 Q240 236 250 222 Z" fill="url(#roof)" stroke="#5a341f" stroke-width="10" stroke-linejoin="round"/>
    <path d="M330 150 Q390 70 500 58 Q610 70 670 150 Z" fill="url(#roofTop)" stroke="#5a341f" stroke-width="10" stroke-linejoin="round"/>
    <path d="M360 140 Q430 88 500 82" stroke="#ffb59c" stroke-width="8" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M238 222 Q228 196 214 190" stroke="#5a341f" stroke-width="10" fill="none" stroke-linecap="round"/>
    <path d="M762 222 Q772 196 786 190" stroke="#5a341f" stroke-width="10" fill="none" stroke-linecap="round"/>
    <circle cx="500" cy="52" r="16" fill="#ffd34d" stroke="#5a341f" stroke-width="7"/>
    <!-- đèn lồng -->
    <g>
      <path d="M262 236 V262" stroke="#5a341f" stroke-width="5"/>
      <ellipse cx="262" cy="300" rx="34" ry="40" fill="url(#lantern)" stroke="#5a341f" stroke-width="7"/>
      <path d="M262 260 Q240 300 262 340 M262 260 Q284 300 262 340" stroke="#a8282f" stroke-width="3" fill="none" opacity="0.6"/>
      <rect x="246" y="255" width="32" height="10" rx="3" fill="#ffd34d" stroke="#5a341f" stroke-width="4"/>
      <rect x="246" y="336" width="32" height="10" rx="3" fill="#ffd34d" stroke="#5a341f" stroke-width="4"/>
      <path d="M256 346 l-4 26 M262 346 v28 M268 346 l4 26" stroke="#ffcf4d" stroke-width="4"/>
    </g>
    <g>
      <path d="M738 236 V262" stroke="#5a341f" stroke-width="5"/>
      <ellipse cx="738" cy="300" rx="34" ry="40" fill="url(#lantern)" stroke="#5a341f" stroke-width="7"/>
      <path d="M738 260 Q716 300 738 340 M738 260 Q760 300 738 340" stroke="#a8282f" stroke-width="3" fill="none" opacity="0.6"/>
      <rect x="722" y="255" width="32" height="10" rx="3" fill="#ffd34d" stroke="#5a341f" stroke-width="4"/>
      <rect x="722" y="336" width="32" height="10" rx="3" fill="#ffd34d" stroke="#5a341f" stroke-width="4"/>
      <path d="M732 346 l-4 26 M738 346 v28 M744 346 l4 26" stroke="#ffcf4d" stroke-width="4"/>
    </g>
    <!-- bát phở bốc khói -->
    <g transform="translate(150 360)">
      <path d="M-12 26 Q-60 -40 -40 -90" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.85"/>
      <path d="M30 26 Q0 -30 26 -84" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" opacity="0.85"/>
      <path d="M-80 30 Q-74 120 10 120 Q94 120 100 30 Z" fill="url(#bowl)" stroke="#5a341f" stroke-width="9"/>
      <ellipse cx="10" cy="30" rx="90" ry="26" fill="#f6c86e" stroke="#5a341f" stroke-width="9"/>
      <path d="M-50 30 q14 -10 28 0 q14 10 28 0 q14 -10 28 0" stroke="#fff8e6" stroke-width="7" fill="none"/>
      <circle cx="-30" cy="24" r="10" fill="#7cc96b"/><circle cx="44" cy="30" r="9" fill="#e85d5d"/>
      <path d="M-56 90 Q10 108 76 90" stroke="#4fa3e0" stroke-width="6" fill="none" stroke-dasharray="10 10"/>
      <path d="M60 -50 L20 34 M78 -44 L34 36" stroke="#a96a3c" stroke-width="9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- chữ tiêu đề -->
  <g filter="url(#shadow)">
    <text x="500" y="610" font-family="Baloo" font-weight="800" font-size="196" text-anchor="middle"
          fill="url(#title)" stroke="#5a1f08" stroke-width="30" stroke-linejoin="round" paint-order="stroke">QUÁN TRỌ</text>
    <g transform="translate(500 680) rotate(-4)">
      <rect x="-130" y="-52" width="260" height="96" rx="40" fill="url(#idle)" stroke="#2f5a1a" stroke-width="10"/>
      <rect x="-112" y="-42" width="224" height="26" rx="13" fill="#ffffff" opacity="0.3"/>
      <text x="0" y="28" font-family="Baloo" font-weight="800" font-size="78" text-anchor="middle"
            fill="#ffffff" stroke="#2f5a1a" stroke-width="12" paint-order="stroke">IDLE</text>
    </g>
  </g>
  <!-- lấp lánh -->
  <g fill="#fff8c0">
    <path d="M860 470 q6 30 30 34 q-24 6 -30 34 q-6 -28 -30 -34 q24 -4 30 -34 Z"/>
    <path d="M120 520 q5 22 22 25 q-17 4 -22 25 q-5 -21 -22 -25 q17 -3 22 -25 Z"/>
    <path d="M820 120 q4 18 18 20 q-14 3 -18 20 q-4 -17 -18 -20 q14 -2 18 -20 Z"/>
  </g>
</svg>
</body></html>
