<svg xmlns="http://www.w3.org/2000/svg" width="160" height="150" viewBox="0 0 160 150">
  <defs>
    <linearGradient id="g_sel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b91c1c" />
      <stop offset="0.6" stop-color="#881337" />
      <stop offset="1" stop-color="#4c0519" />
    </linearGradient>
    <linearGradient id="g_gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a" />
      <stop offset="0.5" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="g_glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f59e0b" stop-opacity="0.35" />
      <stop offset="1" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Warm glow aura behind active tab -->
  <rect x="0" y="2" width="160" height="146" rx="26" fill="url(#g_glow)" />
  <!-- 3D bottom bevel -->
  <rect x="10" y="16" width="140" height="122" rx="20" fill="#2d060d" />
  <!-- Main Cinnabar lacquer body with gold edge -->
  <rect x="10" y="10" width="140" height="122" rx="20" fill="url(#g_sel)" stroke="url(#g_gold)" stroke-width="2.5" />
  <!-- Top inner highlight -->
  <path d="M 24 15 L 136 15" stroke="#fca5a5" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.75" />
  <!-- Corner gold rivets -->
  <circle cx="20" cy="20" r="2.5" fill="#fef08a" />
  <circle cx="140" cy="20" r="2.5" fill="#fef08a" />
  <circle cx="20" cy="122" r="2.5" fill="#f59e0b" />
  <circle cx="140" cy="122" r="2.5" fill="#f59e0b" />
</svg>
