<svg xmlns="http://www.w3.org/2000/svg" width="240" height="252" viewBox="0 0 240 252">
  <defs>
    <radialGradient id="g_shad" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#240c04" stop-opacity="0.45" />
      <stop offset="1" stop-color="#240c04" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="g_gold_rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef08a" />
      <stop offset="0.5" stop-color="#f59e0b" />
      <stop offset="1" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="g_fire_drum" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#f97316" />
      <stop offset="0.5" stop-color="#ea580c" />
      <stop offset="0.85" stop-color="#c2410c" />
      <stop offset="1" stop-color="#7c2d12" />
    </radialGradient>
    <filter id="f_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Ambient Gold Glow -->
  <circle cx="120" cy="120" r="110" fill="#f59e0b" fill-opacity="0.3" filter="url(#f_glow)" />
  <!-- Shadow under button -->
  <ellipse cx="120" cy="238" rx="94" ry="12" fill="url(#g_shad)" />
  <!-- 3D base depth -->
  <circle cx="120" cy="126" r="102" fill="#451a03" stroke="#2b1104" stroke-width="4" />
  <!-- Golden Brass Ring -->
  <circle cx="120" cy="118" r="102" fill="url(#g_gold_rim)" stroke="#78350f" stroke-width="3" />
  <!-- Inner Fire Drum Face -->
  <circle cx="120" cy="118" r="90" fill="url(#g_fire_drum)" stroke="#9a3412" stroke-width="2.5" />
  <!-- Traditional drum studs / rivets -->
  <circle cx="120" cy="36" r="3.5" fill="#fef08a" />
  <circle cx="178" cy="60" r="3.5" fill="#fef08a" />
  <circle cx="202" cy="118" r="3.5" fill="#fef08a" />
  <circle cx="178" cy="176" r="3.5" fill="#fef08a" />
  <circle cx="120" cy="200" r="3.5" fill="#fef08a" />
  <circle cx="62" cy="176" r="3.5" fill="#fef08a" />
  <circle cx="38" cy="118" r="3.5" fill="#fef08a" />
  <circle cx="62" cy="60" r="3.5" fill="#fef08a" />
  <!-- Top gloss arc -->
  <path d="M54,92 Q120,32 186,92 Q120,56 54,92 Z" fill="#ffffff" opacity="0.35" />
</svg>
